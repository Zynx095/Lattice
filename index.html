<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <meta name="theme-color" content="#0c0c0e" />
    <!-- Title and description are set at runtime from src/config/app.config.ts -->
    <title>Lattice — Campus Intelligence</title>
    <script>
      // Applies the saved theme before first paint, so the wrong one never flashes.
      // Written by applyAppearance() in src/config/theme.config.ts.
      (function () {
        var root = document.documentElement
        var saved = null
        try { saved = JSON.parse(localStorage.getItem("ui-theme")) } catch (e) {}
        var choice = (saved && saved.theme) || "dark"
        var theme = choice === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : choice
        root.dataset.theme = theme
        if (saved) {
          if (saved.density) root.dataset.density = saved.density
          if (saved.contrast === "high") root.dataset.contrast = "high"
          var accent = saved.accent && saved.accent[theme]
          if (accent) {
            root.style.setProperty("--primary", accent[0])
            root.style.setProperty("--primary-foreground", accent[1])
          }
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
